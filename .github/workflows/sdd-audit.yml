name: SDD Audit

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Menor privilegio explícito: este workflow se materializa en cada repo
# consumidor, y sin declararlo hereda el default de ESE repo — que puede ser
# write-all. Ninguno de los dos jobs escribe nada.
permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Integridad de la instalación (manifiesto vs árbol)
        run: node scripts/sdd-verify.mjs --root .

      - name: Auditar consistencia del modelo SDD
        run: pnpm audit:sdd

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # gitleaks necesita historial para escanear commits del PR

      - name: Escanear secretos (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
