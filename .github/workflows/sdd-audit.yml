name: SDD Audit

# Las dos verificaciones offline del framework, en cada PR:
#   sdd-verify   ¿los bytes de capa A son los de la versión que dice tener?
#   sdd-audit    ¿el modelo es internamente consistente?
#
# Este workflow se materializa en CADA repo consumidor, así que no puede asumir
# el gestor de paquetes: lo deduce del lockfile, igual que `sdd init`.
#
# Capa A: no se edita en destino.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Menor privilegio explícito: sin declararlo hereda el default de ESE repo,
# que puede ser write-all. Ninguno de los dos jobs escribe nada.
permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Detectar el gestor de paquetes de este repo
        id: pm
        shell: bash
        run: |
          if   [ -f pnpm-lock.yaml ];    then echo "mgr=pnpm" >> "$GITHUB_OUTPUT"
          elif [ -f yarn.lock ];         then echo "mgr=yarn" >> "$GITHUB_OUTPUT"
          elif [ -f package-lock.json ]; then echo "mgr=npm"  >> "$GITHUB_OUTPUT"
          else                                echo "mgr=none" >> "$GITHUB_OUTPUT"
          fi

      # pnpm se instala con su action y versión pineada. `corepack enable pnpm`
      # trae la última, que sin campo `packageManager` en el package.json puede
      # no leer el lockfile de este repo — y en no interactivo eso falla seco.
      - if: steps.pm.outputs.mgr == 'pnpm'
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar dependencias
        shell: bash
        run: |
          set -euo pipefail
          case "${{ steps.pm.outputs.mgr }}" in
            pnpm) pnpm install --frozen-lockfile ;;
            yarn) corepack enable yarn && yarn install --frozen-lockfile ;;
            npm)  npm ci ;;
            none) echo "::notice::sin lockfile — npm install"; npm install ;;
          esac

      # Los dos scripts se invocan con node, no con `pnpm audit:sdd`: el atajo
      # del package.json existe para las personas, no para el CI.
      - name: Integridad de la instalación (manifiesto vs. árbol)
        run: node scripts/sdd-verify.mjs --root .

      - name: Consistencia del modelo SDD
        run: node scripts/sdd-audit.mjs --root .

      # Solo upstream: sdd-selftest.mjs no se materializa en repos consumidores,
      # así que en ellos este paso no encuentra el archivo y se saltea.
      - name: Suite de distribución (solo en el repo del modelo)
        if: hashFiles('scripts/sdd-selftest.mjs') != ''
        run: node scripts/sdd-selftest.mjs --online

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # gitleaks necesita historial para escanear commits del PR

      - name: Escanear secretos (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
